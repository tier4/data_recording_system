- name: Install dependencies for sync_to_x
  ansible.builtin.apt:
    name:
      - psmisc # For fuser command
      - util-linux # For flock command
    state: present
    update_cache: true
  become: true

- name: Create sync_to_x directory
  ansible.builtin.file:
    path: "{{ sync_to_x_script_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create sync script from template
  ansible.builtin.template:
    src: sync_to_x.sh.j2
    dest: "{{ sync_to_x_script_path }}"
    owner: root
    group: root
    mode: "0755"
  register: sync_script
  become: true

- name: Create systemd service file
  ansible.builtin.template:
    src: sync-to-x.service.j2
    dest: /etc/systemd/system/sync-to-x.service
    owner: root
    group: root
    mode: "0644"
  register: systemd_service
  become: true

- name: Create systemd timer file
  ansible.builtin.template:
    src: sync-to-x.timer.j2
    dest: /etc/systemd/system/sync-to-x.timer
    owner: root
    group: root
    mode: "0644"
  register: systemd_timer
  become: true

- name: Reload systemd if service files changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: systemd_service.changed or systemd_timer.changed
  become: true

- name: Enable and start sync-to-x timer
  ansible.builtin.systemd:
    name: sync-to-x.timer
    state: started
    enabled: true
  become: true
