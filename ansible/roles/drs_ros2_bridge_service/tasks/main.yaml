- name: Assert github_pat is set (required for GHCR image pull)
  ansible.builtin.assert:
    that: github_pat != ""
    fail_msg: github_pat must be set to pull images from GHCR

- name: Login to GHCR
  ansible.builtin.include_tasks: ../../common/tasks/ghcr_login.yml

- name: Pre-pull drs-ros2-bridge image
  community.docker.docker_image:
    name: "{{ drs_api_ros2bridge_image }}:{{ drs_version }}"
    source: pull
    state: present
  become: true

- name: Create DRS service directory for ros2_bridge
  ansible.builtin.file:
    path: /opt/drs/service/drs_ros2_bridge
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy docker-compose.yml file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/drs/service/drs_ros2_bridge/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart drs-ros2-bridge

- name: Copy drs-ros2-bridge systemd service file
  ansible.builtin.copy:
    src: drs-ros2-bridge.service
    dest: /etc/systemd/system/drs-ros2-bridge.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable and start drs-ros2-bridge service
  ansible.builtin.systemd:
    name: drs-ros2-bridge
    enabled: true
    state: started
  become: true
