- name: Check if Docker build script exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../docker/ros2_bridge/build.sh"
  register: docker_build_script

- name: Build DRS ROS 2 Bridge Docker image
  ansible.builtin.shell: |
    cd {{ playbook_dir }}/..
    bash docker/ros2_bridge/build.sh --colcon-parallel-workers 2
  when: docker_build_script.stat.exists
  register: build_result
  changed_when: true

- name: Create DRS service directory for ros2_bridge
  ansible.builtin.file:
    path: /opt/drs/service/drs_ros2_bridge
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy docker-compose.yml file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/drs/service/drs_ros2_bridge/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Copy drs-ros2-bridge systemd service file
  ansible.builtin.copy:
    src: drs-ros2-bridge.service
    dest: /etc/systemd/system/drs-ros2-bridge.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable and start drs-ros2-bridge service
  ansible.builtin.systemd:
    name: drs-ros2-bridge
    enabled: true
    state: started
  become: true
