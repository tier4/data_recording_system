- name: Install ptpd
  ansible.builtin.apt:
    name:
      - ptpd
    update_cache: true
  become: true

- name: Copy service template file
  ansible.builtin.copy:
    src: ptpd_master@.service
    dest: /etc/systemd/system/
  become: true

- name: Install ptpd client service file
  ansible.builtin.systemd:
    name: ptpd_master@{{ item }}.service
    daemon_reload: true
    enabled: true
    masked: false
  become: true
  with_items: "{{ ptpd_host_interfaces }}"

- name: Save service name for later use
  set_fact:
    enabled_ptpd_services: "{{ (enabled_ptpd_services | default([])) + ['ptpd_master@' + item + '.service'] }}"
  with_items: "{{ ptpd_host_interfaces }}"
