ptp:
  # Time synchronization type: 'GNSS' or 'NTP'
  # GNSS: Use GNSS/INS as Grandmaster (GM) for PTP
  # NTP: Sync system time with NTP once at startup, then use PTP for device synchronization
  time_sync_type: GNSS

  # NTP Server (used when time_sync_type is NTP)
  ntp_server: ntp.nict.jp

  # Port configuration
  master_port: mgbe0
  slave_ports:
    - eqos0
    - enP1p1s0

  # ptp4l configuration values
  clock_class: 248 # ptp4l default value
  priority1: 128 # ptp4l default value
  priority2: 128 # ptp4l default value

# Service files directory
ptp_service_dir: /opt/drs/service/ptp
