- name: Assert github_pat is set (required for private drs-api artifacts)
  ansible.builtin.assert:
    that: github_pat != ""
    fail_msg: github_pat must be set to access private drs-api artifacts on GitHub Releases and GHCR

- name: Login to GHCR
  ansible.builtin.include_tasks: ../../common/tasks/ghcr_login.yml

- name: Pre-pull drs-api-gateway image
  community.docker.docker_image:
    name: "{{ drs_api_gateway_image }}:{{ drs_api_version }}"
    source: pull
    state: present
  become: true

- name: Pre-pull drs-dashboard image
  community.docker.docker_image:
    name: "{{ drs_api_dashboard_image }}:{{ drs_api_version }}"
    source: pull
    state: present
  become: true

- name: Create DRS service directory
  ansible.builtin.file:
    path: /opt/drs/service/drs_dashboard
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy api-gateway configuration file
  ansible.builtin.template:
    src: api-gateway.yaml.j2
    dest: /opt/drs/service/drs_dashboard/api-gateway.yaml
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy docker-compose.yml file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/drs/service/drs_dashboard/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart drs-dashboard

- name: Copy drs-dashboard systemd service file
  ansible.builtin.copy:
    src: drs-dashboard.service
    dest: /etc/systemd/system/drs-dashboard.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable and start unified drs-dashboard service
  ansible.builtin.systemd:
    name: drs-dashboard
    enabled: true
    state: started
  become: true
