- name: Check if Docker build script exists
  stat:
    path: "{{ playbook_dir }}/../src/drs-api/docker/build.sh"
  register: docker_build_script

- name: Build Docker images
  shell: |
    {{ playbook_dir }}/../src/drs-api/docker/build.sh
  when: docker_build_script.stat.exists
  register: build_result
  changed_when: true

- name: Create DRS service directory
  file:
    path: /opt/drs/service/drs_dashboard
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: yes

- name: Copy api-gateway configuration file
  copy:
    src: api-gateway.yaml
    dest: /opt/drs/service/drs_dashboard/api-gateway.yaml
    owner: root
    group: root
    mode: "0644"
  become: yes

- name: Copy docker-compose.yml file
  copy:
    src: docker-compose.yml
    dest: /opt/drs/service/drs_dashboard/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  become: yes

- name: Copy drs-dashboard systemd service file
  copy:
    src: drs-dashboard.service
    dest: /etc/systemd/system/drs-dashboard.service
    owner: root
    group: root
    mode: "0644"
  become: yes

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: yes

- name: Enable and start unified drs-dashboard service
  systemd:
    name: drs-dashboard
    enabled: yes
    state: started
  become: yes
