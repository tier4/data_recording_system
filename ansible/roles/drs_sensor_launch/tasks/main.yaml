---
- name: Create DRS service directory
  ansible.builtin.file:
    path: /opt/drs/service/drs_sensor_launch
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Create DRS launch script
  ansible.builtin.template:
    src: launch.sh.jinja2
    dest: /opt/drs/service/drs_sensor_launch/launch.sh
    owner: root
    group: root
    mode: '0755'
  become: true
  notify: restart drs-launch

- name: Create systemd service file
  ansible.builtin.template:
    src: drs_sensor_launch.service.jinja2
    dest: /etc/systemd/system/drs-sensor-launch.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - reload systemd
    - restart drs-sensor-launch

- name: Enable and start DRS sensor launch service
  ansible.builtin.systemd:
    name: drs-sensor-launch.service
    daemon_reload: true
    enabled: true
    state: started
  become: true
