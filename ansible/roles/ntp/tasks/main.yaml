- name: Install chrony package on Ubuntu
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Check if chrony.conf exists
  ansible.builtin.stat:
    path: /etc/chrony/chrony.conf
  register: chrony_conf_stat

- name: Backup original chrony.conf
  ansible.builtin.copy:
    src: /etc/chrony/chrony.conf
    dest: /etc/chrony/chrony.conf.{{ ansible_date_time.epoch }}.bak
    remote_src: true
    mode: "0644"
  become: true
  when: chrony_conf_stat.stat.exists

- name: Deploy chrony.conf
  ansible.builtin.copy:
    src: chrony.conf
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Restart and enable chrony service
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    enabled: true
    daemon_reload: true
  become: true
