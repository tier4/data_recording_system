- name: Copy jetson-clocks systemd service file
  ansible.builtin.copy:
    src: jetson-clocks.service
    dest: /etc/systemd/system/jetson-clocks.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Enable and start jetson-clocks service
  ansible.builtin.systemd:
    name: jetson-clocks
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Check current Jetson power mode
  ansible.builtin.command: nvpmodel -q
  register: current_power_mode
  changed_when: false
  become: true

- name: Set Jetson to maximum performance mode (nvpmodel -m 0)
  ansible.builtin.shell: echo "YES" | nvpmodel -m 0
  when: "'NV Power Mode: MAXN' not in current_power_mode.stdout"
  become: true
  register: nvpmodel_result
  failed_when:
    - nvpmodel_result.rc != 0
    - "'Reboot required' not in nvpmodel_result.stdout"
    - "'rebooting' not in nvpmodel_result.stdout"
  notify: reboot_required
  changed_when: true

- name: Check if reboot is required for power mode change
  ansible.builtin.debug:
    msg: Reboot required to apply Jetson power mode change
  when:
    - nvpmodel_result is defined
    - nvpmodel_result.changed
    - "'Reboot required' in nvpmodel_result.stdout"

- name: Install jtop
  ansible.builtin.pip:
    name: jetson-stats
    executable: pip3
  become: true
