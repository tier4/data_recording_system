---
- name: Install hostapd and related packages
  apt:
    name:
      - hostapd
      - wireless-tools
      - wpasupplicant
    state: present
    update_cache: yes

- name: Stop hostapd service temporarily
  systemd:
    name: hostapd
    state: stopped

- name: Configure hostapd
  template:
    src: hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    mode: '0600'
    backup: yes
  notify: restart hostapd

- name: Configure hostapd daemon
  lineinfile:
    path: /etc/default/hostapd
    regexp: '^#?DAEMON_CONF='
    line: 'DAEMON_CONF="/etc/hostapd/hostapd.conf"'
    create: yes

- name: Unmask hostapd service
  systemd:
    name: hostapd
    masked: no

- name: Enable and start hostapd
  systemd:
    name: hostapd
    enabled: yes
    state: started