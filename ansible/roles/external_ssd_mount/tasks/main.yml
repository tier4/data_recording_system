- name: Install udev rule to prevent udisks2 auto-mounting
  ansible.builtin.template:
    src: 99-no-automount-comlops.rules.j2
    dest: /etc/udev/rules.d/99-no-automount-comlops.rules
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload udev rules

- name: Ensure parent directory exists
  ansible.builtin.file:
    path: "{{ mount_point }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Add fstab entry for COMLOPS
  ansible.posix.mount:
    path: "{{ mount_point }}"
    src: LABEL={{ ssd_label }}
    fstype: "{{ filesystem_type }}"
    opts: "{{ mount_options }}"
    dump: 0
    passno: 0
    state: present
