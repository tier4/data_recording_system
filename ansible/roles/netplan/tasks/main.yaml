- name: Install netplan
  ansible.builtin.apt:
    name: netplan.io
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Copy network config file
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/netplan/{{ item }}"
    mode: 0644
  with_items: "{{ netplan_files }}"
  become: true

- name: Netplan apply
  command: netplan apply
  become: true
