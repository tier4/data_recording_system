network:
  version: 2
  renderer: networkd
  ethernets:
    # NAS
    mgbe1:
      addresses: [192.168.10.2/24]
      dhcp4: false
      dhcp6: false
      mtu: 9000
      optional: true
    # ADI Board
    mgbe0:
      addresses: [192.168.4.1/24]
      dhcp4: false
      dhcp6: false
      mtu: 9000
      optional: false
    # LiDAR
    eqos0:
      addresses: [192.168.2.2/24]
      dhcp4: false
      dhcp6: false
      optional: false
    # ECU
    enP1p1s0:
      addresses: [192.168.20.2/24]
      dhcp4: false
      dhcp6: false
      optional: false
      # gateway configuration to connect the Internet
      routes:
        - to: default
          via: 192.168.20.10
