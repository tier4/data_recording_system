# Simplified Tailscale installation using official script

- name: Download and run Tailscale official installer
  ansible.builtin.shell: |
    curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale
  become: true

- name: Check Tailscale status
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Authenticate with Tailscale (if authkey provided)
  ansible.builtin.command: tailscale up --authkey={{ tailscale_authkey }}
  when:
    - tailscale_authkey is defined
    - tailscale_authkey != ""
    - tailscale_status.rc != 0 or "Logged out" in tailscale_status.stdout
  changed_when: true

- name: Display manual authentication instructions
  ansible.builtin.debug:
    msg: |
      Tailscale installed successfully!

      To authenticate manually:
      1. Run: sudo tailscale up
      2. Visit the URL shown to authenticate
      3. Device will join your Tailscale network
  when:
    - tailscale_authkey is not defined or tailscale_authkey == ""
    - tailscale_status.rc != 0 or "Logged out" in tailscale_status.stdout

- name: Enable IP forwarding for subnet routing (optional)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: tailscale_enable_routing | default(false)
  notify: reload sysctl
