- name: Ensure can-utils is installed
  ansible.builtin.package:
    name: can-utils
    state: present
  become: true

- name: Create CAN network files for systemd-networkd
  ansible.builtin.template:
    src: can.network.j2
    dest: /etc/systemd/network/50-{{ item.name }}.network
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ can_interfaces }}"
  notify: Restart systemd-networkd
