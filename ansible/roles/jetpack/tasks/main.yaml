- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name:
      - nvidia-jetpack
    update_cache: true

- name: Add settings to drs.env
  ansible.builtin.blockinfile:
    path: /opt/drs/config/drs.env
    state: present
    create: true
    mode: 0644
    marker: "# {mark} cuda"
    block: |
      export PATH="/usr/local/cuda/bin:$PATH"
      export LD_LIBRARY_PATH="/usr/local/cuda/lib64:$LD_LIBRARY_PATH"
  become: true
