---
- name: Install GPIO dependencies
  package:
    name:
      - libgpiod-dev
      - gpiod
    state: present
  become: yes

- name: Create gpio group
  group:
    name: gpio
    state: present
  become: yes

- name: Add user to gpio group
  user:
    name: "{{ sensor_trigger_user }}"
    groups: gpio
    append: yes
  become: yes
  notify: user logout required

- name: Set GPIO device permissions
  shell: chmod 666 /dev/gpiochip*
  become: yes
  ignore_errors: yes

- name: Create udev rule for GPIO permissions
  copy:
    dest: /etc/udev/rules.d/99-gpio-permissions.rules
    content: |
      KERNEL=="gpiochip*", GROUP="gpio", MODE="0660"
    owner: root
    group: root
    mode: "0644"
  become: yes
  notify: reload udev

- name: Set realtime scheduling limits
  lineinfile:
    path: /etc/security/limits.conf
    line: "{{ sensor_trigger_user }}    -   rtprio   {{ sensor_trigger_rtprio }}"
    state: present
    backup: yes
  become: yes
  notify: user logout required

- name: Set memlock limits for realtime scheduling
  lineinfile:
    path: /etc/security/limits.conf
    line: "{{ sensor_trigger_user }}    -   memlock  {{ sensor_trigger_memlock }}"
    state: present
    backup: yes
  become: yes
  notify: user logout required
