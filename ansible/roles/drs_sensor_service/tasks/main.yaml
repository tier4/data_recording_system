- name: Create DRS service directory
  ansible.builtin.file:
    path: /opt/drs/service/drs_sensor
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy default parameters when custom params enabled
  ansible.builtin.copy:
    src: "{{ drs_install_dir }}/share/individual_params/config/default/"
    dest: "{{ drs_param_root_dir }}"
    owner: "{{ drs_user }}"
    group: "{{ drs_group }}"
    mode: "0755"
    remote_src: true
  become: true
  when: drs_use_custom_params | bool

- name: Create DRS launch script
  ansible.builtin.template:
    src: launch.sh.jinja2
    dest: /opt/drs/service/drs_sensor/launch.sh
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: restart drs-sensor

- name: Deploy Kria GMSL setup script
  ansible.builtin.template:
    src: setup_kria.sh.jinja2
    dest: /opt/drs/service/drs_sensor/setup_kria.sh
    owner: root
    group: root
    mode: "0755"
  become: true
  when: drs_enable_fisheye | bool

- name: Deploy trigger.json configuration
  ansible.builtin.template:
    src: trigger.json.jinja2
    dest: /opt/drs/service/drs_sensor/trigger.json
    owner: root
    group: root
    mode: "0644"
  become: true
  when: drs_enable_fisheye | bool

- name: Deploy setup-kria systemd service file
  ansible.builtin.template:
    src: setup-kria.service.jinja2
    dest: /etc/systemd/system/setup-kria.service
    owner: root
    group: root
    mode: "0644"
  become: true
  when: drs_enable_fisheye | bool
  notify: reload systemd

- name: Enable and start setup-kria service
  ansible.builtin.systemd:
    name: setup-kria.service
    daemon_reload: true
    enabled: true
    state: started
  become: true
  when: drs_enable_fisheye | bool

- name: Disable and stop setup-kria service
  ansible.builtin.systemd:
    name: setup-kria.service
    daemon_reload: true
    enabled: false
    state: stopped
  become: true
  when: not (drs_enable_fisheye | bool)
  ignore_errors: true

- name: Create systemd service file
  ansible.builtin.template:
    src: drs-sensor.service.jinja2
    dest: /etc/systemd/system/drs-sensor.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - reload systemd
    - restart drs-sensor

- name: Enable and start DRS sensor launch service
  ansible.builtin.systemd:
    name: drs-sensor.service
    daemon_reload: true
    enabled: true
    state: started
  become: true
