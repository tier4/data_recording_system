---
- name: Create DRS service directory
  ansible.builtin.file:
    path: /opt/drs/service/drs_sensor
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy default parameters when custom params enabled
  ansible.builtin.copy:
    src: "{{ drs_install_dir }}/share/individual_params/config/default/"
    dest: "{{ drs_param_root_dir }}"
    owner: "{{ drs_user }}"
    group: "{{ drs_group }}"
    mode: "0755"
    remote_src: true
  become: true
  when: drs_use_custom_params | bool

- name: Create DRS launch script
  ansible.builtin.template:
    src: launch.sh.jinja2
    dest: /opt/drs/service/drs_sensor/launch.sh
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: restart drs-sensor

- name: Create systemd service file
  ansible.builtin.template:
    src: drs-sensor.service.jinja2
    dest: /etc/systemd/system/drs-sensor.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - reload systemd
    - restart drs-sensor

- name: Enable and start DRS sensor launch service
  ansible.builtin.systemd:
    name: drs-sensor.service
    daemon_reload: true
    enabled: true
    state: started
  become: true
