- name: Stop and disable drs-dashboard.service if disabled
  ansible.builtin.systemd:
    name: drs-dashboard.service
    state: stopped
    enabled: false
  become: true
  ignore_errors: true
  when: not (has_dashboard_service | bool)

- name: Stop and disable drs-ros2-bridge.service if disabled
  ansible.builtin.systemd:
    name: drs-ros2-bridge.service
    state: stopped
    enabled: false
  become: true
  ignore_errors: true
  when: not (has_dashboard_service | bool)

- name: Remove NTP server configuration if disabled
  ansible.builtin.file:
    path: /etc/chrony/chrony.conf.d/drs-ntp-server.conf
    state: absent
  become: true
  ignore_errors: true
  when: not (ntp_server_enabled | default(false) | bool)

- name: Remove chrony service override configuration if ntp_server is disabled
  ansible.builtin.file:
    path: /etc/systemd/system/chrony.service.d/override.conf
    state: absent
  become: true
  ignore_errors: true
  when: not (ntp_server_enabled | default(false) | bool)

- name: Stop and disable chrony service if ntp_server is disabled
  ansible.builtin.systemd:
    name: chrony
    state: stopped
    enabled: false
    daemon_reload: true
  become: true
  ignore_errors: true
  when: not (ntp_server_enabled | default(false) | bool)

- name: Remove UDP 123 INPUT rule (dport) if ntp_server is disabled
  ansible.builtin.command: iptables -D INPUT -p udp --dport 123 -j ACCEPT
  register: remove_udp123_dport
  changed_when: remove_udp123_dport.rc == 0
  failed_when: false
  become: true
  when: not (ntp_server_enabled | default(false) | bool)

- name: Remove UDP 123 INPUT rule (sport) if ntp_server is disabled
  ansible.builtin.command: iptables -D INPUT -p udp --sport 123 -j ACCEPT
  register: remove_udp123_sport
  changed_when: remove_udp123_sport.rc == 0
  failed_when: false
  become: true
  when: not (ntp_server_enabled | default(false) | bool)

- name: Save iptables rules after removing NTP rules
  ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
  become: true
  changed_when: remove_udp123_dport.rc == 0 or remove_udp123_sport.rc == 0
  when:
    - not (ntp_server_enabled | default(false) | bool)
    - (remove_udp123_dport.rc == 0 or remove_udp123_sport.rc == 0)
