---
- name: Create recorder service directory
  ansible.builtin.file:
    path: /opt/drs/service/drs_recorder
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Create recorder launch script
  ansible.builtin.template:
    src: launch.sh.jinja2
    dest: /opt/drs/service/drs_recorder/launch.sh
    owner: root
    group: root
    mode: '0755'
  become: true
  notify: restart drs-recorder

- name: Copy proto recorder config for ECU0
  ansible.builtin.copy:
    src: record_topics_ecu0.yaml
    dest: /opt/drs/config/record_topics_ecu0.yaml
    owner: root
    group: root
    mode: '0644'
  become: true
  when: "'ecu0' in inventory_hostname"
  notify: restart drs-recorder

- name: Copy proto recorder config for ECU1
  ansible.builtin.copy:
    src: record_topics_ecu1.yaml
    dest: /opt/drs/config/record_topics_ecu1.yaml
    owner: root
    group: root
    mode: '0644'
  become: true
  when: "'ecu1' in inventory_hostname"
  notify: restart drs-recorder

- name: Create systemd service file
  ansible.builtin.template:
    src: drs_recorder.service.jinja2
    dest: /etc/systemd/system/drs-recorder.service
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - reload systemd
    - restart drs-recorder

- name: Enable and start recorder launch service
  ansible.builtin.systemd:
    name: drs-recorder.service
    daemon_reload: true
    enabled: true
    state: started
  become: true