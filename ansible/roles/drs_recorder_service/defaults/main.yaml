# Default variables for drs_recorder_service role
drs_user: "{{ ansible_user | default('nvidia') }}"
drs_group: "{{ ansible_user | default('nvidia') }}"
drs_install_dir: /opt/drs/install

# Topic recording configuration
drs_enable_vehicle_can: false
drs_enable_fisheye: false

# Data recording directory
drs_recorder_data_dir: /mnt/ssd/data
