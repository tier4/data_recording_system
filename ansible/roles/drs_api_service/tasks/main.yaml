- name: Assert github_pat is set (required for private drs-api artifacts)
  ansible.builtin.assert:
    that: github_pat != ""
    fail_msg: github_pat must be set to access private drs-api artifacts on GitHub Releases and GHCR

- name: Download module-manager binary
  ansible.builtin.get_url:
    url: https://github.com/tier4/drs-api/releases/download/v{{ drs_api_version }}/module-manager-arm64-static
    dest: /usr/local/bin/module-manager
    mode: "0755"
    url_username: token
    url_password: "{{ github_pat }}"
    force_basic_auth: true
  become: true
  notify: restart drs-api

- name: Download drs-cli binary
  ansible.builtin.get_url:
    url: https://github.com/tier4/drs-api/releases/download/v{{ drs_api_version }}/drs-cli-arm64-static
    dest: /usr/local/bin/drs-cli
    mode: "0755"
    url_username: token
    url_password: "{{ github_pat }}"
    force_basic_auth: true
  become: true

- name: Create DRS API service directory
  ansible.builtin.file:
    path: /opt/drs/service/drs_api
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Copy drs_api launch script
  ansible.builtin.copy:
    src: launch.sh
    dest: /opt/drs/service/drs_api/launch.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy module-manager configuration
  become: true
  ansible.builtin.template:
    src: "{{ module_manager_config }}.j2"
    dest: /opt/drs/config/module-manager.yaml
    owner: "{{ drs_user }}"
    group: "{{ drs_group }}"
    mode: "0644"
  when: module_manager_config == "module-manager-ecu1.yaml"
  register: deploy_module_manager_template

- name: Deploy module-manager configuration (static)
  become: true
  ansible.builtin.copy:
    src: "{{ module_manager_config }}"
    dest: /opt/drs/config/module-manager.yaml
    owner: "{{ drs_user }}"
    group: "{{ drs_group }}"
    mode: "0644"
  when: module_manager_config != "module-manager-ecu1.yaml"

- name: Deploy systemd service file
  become: true
  ansible.builtin.template:
    src: drs-api.service.jinja2
    dest: /etc/systemd/system/drs-api.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd

- name: Enable and start DRS API service
  become: true
  ansible.builtin.systemd:
    name: drs-api
    enabled: true
    state: started
  notify:
    - reload systemd
