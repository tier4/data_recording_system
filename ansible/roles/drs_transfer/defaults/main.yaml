# Source and destination directories
drs_transfer_source_dir: /mnt/ssd/data
drs_transfer_destinations:
  - /mnt/external/data
  - /mnt/nas/data
drs_transfer_hostname: "{{ ansible_hostname }}"

# Timing and performance settings
drs_transfer_rsync_bw_limit: 100m
drs_transfer_timer_interval: 1min
drs_transfer_automount_trigger_timeout_sec: 8
drs_transfer_free_space_limit_gb: 10
drs_transfer_active_file_threshold_sec: 30

# System paths
drs_transfer_script_path: /opt/drs/service/drs_transfer/drs_transfer.sh
drs_transfer_lock_file: /var/run/drs_transfer.lock

# Service resource limits
drs_transfer_cpu_quota: 50%
drs_transfer_io_weight: 10
