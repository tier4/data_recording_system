---
- name: Add Tailscale GPG key
  apt_key:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.gpg
    state: present

- name: Add Tailscale repository
  apt_repository:
    repo: "deb https://pkgs.tailscale.com/stable/ubuntu noble main"
    state: present
    filename: tailscale

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Tailscale
  apt:
    name: tailscale
    state: present

- name: Check if Tailscale is already authenticated
  command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Display Tailscale authentication instructions
  debug:
    msg: |
      Tailscale has been installed. To authenticate this device:
      1. Run: sudo tailscale up
      2. Follow the URL provided to authenticate
      3. The device will be connected to your Tailscale network
  when: tailscale_status.rc != 0 or "Logged out" in tailscale_status.stdout

- name: Enable IP forwarding for Tailscale
  lineinfile:
    path: /etc/sysctl.d/99-tailscale.conf
    line: "{{ item }}"
    create: yes
  loop:
    - "net.ipv4.ip_forward = 1"
    - "net.ipv6.conf.all.forwarding = 1"
  notify: reload sysctl