# ROS 2 Humble Installation Role for Ubuntu 22.04 (Jammy)

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Check if ROS 2 packages are already installed
  ansible.builtin.set_fact:
    ros2_already_installed: >-
      {{
        ('ros-humble-desktop' in ansible_facts.packages) and
        ('ros-dev-tools' in ansible_facts.packages) and
        ('ros-humble-rosbag2-storage-mcap' in ansible_facts.packages)
      }}

- name: Install ROS 2
  when: not ros2_already_installed
  block:
    # Setup Sources
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Install software-properties-common
      ansible.builtin.apt:
        name: software-properties-common
        state: present
      become: true

    - name: Add universe repository
      ansible.builtin.command: add-apt-repository -y universe
      become: true
      changed_when: true

    - name: Install curl
      ansible.builtin.apt:
        name: curl
        state: present
      become: true

    - name: Get latest ROS APT source version
      ansible.builtin.uri:
        url: https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest
        method: GET
        return_content: true
      register: ros_apt_source_release

    - name: Extract ROS APT source version
      ansible.builtin.set_fact:
        ros_apt_source_version: "{{ ros_apt_source_release.json.tag_name }}"

    - name: Download ROS 2 APT source package
      ansible.builtin.get_url:
        url: https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ ros_apt_source_version }}/ros2-apt-source_{{ ros_apt_source_version }}.{{ ansible_distribution_release }}_all.deb
        dest: /tmp/ros2-apt-source.deb
        mode: 0644

    - name: Install ROS 2 APT source package
      ansible.builtin.apt:
        deb: /tmp/ros2-apt-source.deb
        state: present
      become: true

    - name: Clean up downloaded deb file
      ansible.builtin.file:
        path: /tmp/ros2-apt-source.deb
        state: absent

    # Install ROS 2 packages
    - name: Update apt cache after adding ROS 2 repository
      ansible.builtin.apt:
        update_cache: true
      become: true

    - name: Upgrade system packages (important for Ubuntu 22.04)
      ansible.builtin.apt:
        upgrade: true
        update_cache: true
      become: true

    - name: Install ROS 2 Humble Desktop
      ansible.builtin.apt:
        name: ros-humble-desktop
        state: present
      become: true

    - name: Install ros-dev-tools
      ansible.builtin.apt:
        name: ros-dev-tools
        state: present
      become: true

    - name: Install mcap
      ansible.builtin.apt:
        name: ros-humble-rosbag2-storage-mcap
        state: present
      become: true

# ROS 2 Environment Configuration
- name: Add ROS2 settings to drs.env
  ansible.builtin.blockinfile:
    path: /opt/drs/config/drs.env
    state: present
    create: true
    mode: 0644
    marker: "# {mark} ros2"
    block: |
      export ROS_DOMAIN_ID={{ ros_domain_id }}
      export ROS_DISTRO=humble
      export ROS_LOG_DIR=/tmp/drs/log
  become: true
