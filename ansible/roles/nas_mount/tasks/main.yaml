- name: Install NFS client packages
  ansible.builtin.package:
    name: nfs-common
    state: present
  become: true

- name: Create mount point directory
  ansible.builtin.file:
    path: "{{ nas_mount_point }}"
    state: directory
    mode: "0755"
  become: true

- name: Mount NFS share
  ansible.posix.mount:
    path: "{{ nas_mount_point }}"
    src: "{{ nas_address }}:{{ nas_export_path }}"
    fstype: nfs4
    opts: "{{ nfs_options }}"
    state: present
    backup: true
  become: true
