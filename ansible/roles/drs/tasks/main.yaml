- name: Create DRS installation directory
  ansible.builtin.file:
    path: "{{ drs_install_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ drs_user }}"
    group: "{{ drs_group }}"
  become: true

- name: Import dependencies using vcs from drs.repos
  ansible.builtin.shell: |
    cd {{ drs_src_dir }}
    if [ -n "{{ github_pat }}" ]; then
      sed -e 's|https://github.com/|https://{{ github_pat }}@github.com/|g' \
          -e 's|git@github.com:|https://{{ github_pat }}@github.com/|g' \
          drs.repos | vcs import src
    else
      vcs import src < drs.repos
    fi
  args:
    executable: /bin/bash
  become_user: "{{ drs_user }}"
  environment:
    HOME: /home/{{ drs_user }}
  changed_when: true

- name: Initialize rosdep system-wide
  ansible.builtin.shell: |
    rosdep init
  args:
    executable: /bin/bash
  become: true
  ignore_errors: true
  changed_when: true

- name: Update rosdep for user
  ansible.builtin.shell: |
    rosdep update
  args:
    executable: /bin/bash
  become_user: "{{ drs_user }}"
  environment:
    HOME: /home/{{ drs_user }}
  changed_when: true

- name: Install ROS dependencies with rosdep
  ansible.builtin.shell: |
    cd {{ drs_src_dir }}
    source /opt/ros/humble/setup.bash
    rosdep install -y -r --from-paths src --ignore-src
  args:
    executable: /bin/bash
  become_user: "{{ drs_user }}"
  environment:
    HOME: /home/{{ drs_user }}
  changed_when: true

- name: Build DRS packages directly to installation directory
  ansible.builtin.shell: |
    cd {{ drs_src_dir }}
    source /opt/drs/config/drs.env
    source /opt/ros/humble/setup.bash
    colcon build --merge-install --install-base {{ drs_install_dir }} --parallel-workers 4 --cmake-args -DCMAKE_BUILD_TYPE={{ drs_build_type }} --packages-up-to {{ drs_packages | join(' ') }}
  args:
    executable: /bin/bash
  changed_when: true

- name: Set ownership of DRS installation directory
  ansible.builtin.file:
    path: "{{ drs_install_dir }}"
    owner: "{{ drs_user }}"
    group: "{{ drs_group }}"
    recurse: true
  become: true
