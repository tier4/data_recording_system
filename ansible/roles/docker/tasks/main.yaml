---
- name: Install NVIDIA container toolkit and curl
  apt:
    name:
      - nvidia-container-toolkit
      - curl
    state: present
    update_cache: yes
  become: yes

- name: Download and install Docker
  shell: curl https://get.docker.com | sh
  args:
    creates: /usr/bin/docker
  become: yes

- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: yes
    state: started
  become: yes

- name: Configure NVIDIA runtime for Docker
  command: nvidia-ctk runtime configure --runtime=docker
  become: yes

- name: Add user to docker group
  user:
    name: "{{ ansible_user_id | default(lookup('env', 'USER')) }}"
    groups: docker
    append: yes
  become: yes

- name: Stop Docker service before data migration
  systemd:
    name: docker
    state: stopped
  become: yes

- name: Check Docker data directory size
  shell: du -csh /var/lib/docker/
  register: docker_size_before
  become: yes
  changed_when: false

- name: Create new Docker data directory
  file:
    path: /mnt/ssd/docker
    state: directory
    mode: "0755"
  become: yes

- name: Migrate Docker data to new location
  command: rsync -axPS /var/lib/docker/ /mnt/ssd/docker/
  become: yes

- name: Check new Docker data directory size
  shell: du -csh /mnt/ssd/docker/
  register: docker_size_after
  become: yes
  changed_when: false

- name: Update Docker daemon configuration
  copy:
    content: |
      {
          "runtimes": {
              "nvidia": {
                  "path": "nvidia-container-runtime",
                  "runtimeArgs": []
              }
          },
          "default-runtime": "nvidia",
          "data-root": "/mnt/ssd/docker"
      }
    dest: /etc/docker/daemon.json
    backup: yes
  become: yes

- name: Restart Docker service
  systemd:
    name: docker
    state: restarted
    daemon_reload: yes
  become: yes
