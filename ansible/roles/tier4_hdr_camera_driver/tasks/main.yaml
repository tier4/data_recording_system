- name: Install Tier4 camera driver
  block:
    - name: Download Tier4 camera driver package
      get_url:
        url: https://github.com/tier4/tier4_automotive_hdr_camera/releases/download/v2.0.0/tier4-camera-gmsl_2.0.0_arm64.deb
        dest: /tmp/tier4-camera-gmsl_2.0.0_arm64.deb
        mode: "0644"

    - name: Install Tier4 camera driver package
      apt:
        deb: /tmp/tier4-camera-gmsl_2.0.0_arm64.deb
        state: present
      become: yes

    - name: Clone Tier4 automotive HDR camera repository
      git:
        repo: https://github.com/tier4/tier4_automotive_hdr_camera.git
        dest: /tmp/tier4_automotive_hdr_camera
        version: v2.0.0
        force: yes

    - name: Ensure python3 is installed
      apt:
        name: python3
        state: present
      become: yes

    - name: Ensure device-tree-compiler is installed
      apt:
        name: device-tree-compiler
        state: present
      become: yes

    - name: Generate overlay DTS file
      command: python3 make_overlay_dts_anvil.py {{ make_overlay_dts_anvil_option }} R36 -o tier4-camera-device-tree-overlay-anvil.dts
      args:
        chdir: /tmp/tier4_automotive_hdr_camera/tools/dts_generator/
        creates: /tmp/tier4_automotive_hdr_camera/tools/dts_generator/tier4-camera-device-tree-overlay-anvil.dts

    - name: Compile DTS to DTB
      command: dtc -O dtb -o tier4-camera-device-tree-overlay-anvil.dtbo -@ tier4-camera-device-tree-overlay-anvil.dts
      args:
        chdir: /tmp/tier4_automotive_hdr_camera/tools/dts_generator/
        creates: /tmp/tier4_automotive_hdr_camera/tools/dts_generator/tier4-camera-device-tree-overlay-anvil.dtbo

    - name: Copy DTBO file to /boot
      copy:
        src: /tmp/tier4_automotive_hdr_camera/tools/dts_generator/tier4-camera-device-tree-overlay-anvil.dtbo
        dest: /boot/tier4-camera-device-tree-overlay-anvil.dtbo
        remote_src: yes
        mode: "0644"
      become: yes

    - name: Apply device tree overlay
      command: fdtoverlay -o /boot/kernel_tegra234-orin-agx-cti-AGX201-user-custom.dtb -i /boot/dtb/kernel_tegra234-orin-agx-cti-AGX201.dtb /boot/tier4-camera-device-tree-overlay-anvil.dtbo
      args:
        chdir: /boot/
        creates: /boot/kernel_tegra234-orin-agx-cti-AGX201-user-custom.dtb
      become: yes

    - name: Backup extlinux.conf
      copy:
        src: /boot/extlinux/extlinux.conf
        dest: /boot/extlinux/extlinux.conf.backup
        remote_src: yes
        backup: yes
      become: yes

    - name: Create new extlinux.conf with t4_primary entry
      copy:
        content: |
          TIMEOUT 30
          DEFAULT t4_primary

          MENU TITLE L4T boot options

          LABEL primary
                MENU LABEL primary kernel
                LINUX /boot/Image
                INITRD /boot/initrd
                APPEND ${cbootargs} root=/dev/mmcblk0p1 rw rootwait rootfstype=ext4 mminit_loglevel=4 console=ttyTCU0,115200 console=ttyAMA0,115200 firmware_class.path=/etc/firmware fbcon=map:0 nospectre_bhb video=efifb:off console=tty0

          LABEL t4_primary
                MENU LABEL t4_primary kernel
                LINUX /boot/Image
                INITRD /boot/initrd
                FDT /boot/kernel_tegra234-orin-agx-cti-AGX201-user-custom.dtb
                APPEND ${cbootargs} root=/dev/mmcblk0p1 rw rootwait rootfstype=ext4 mminit_loglevel=4 console=ttyTCU0,115200 console=ttyAMA0,115200 firmware_class.path=/etc/firmware fbcon=map:0 nospectre_bhb video=efifb:off console=tty0
        dest: /boot/extlinux/extlinux.conf
        owner: root
        group: root
        mode: "0644"
      become: yes

    - name: Configure tier4_imx490 modprobe options
      lineinfile:
        path: /etc/modprobe.d/tier4-imx490.conf
        regexp: "^options tier4_imx490"
        line: "options tier4_imx490 trigger_mode=3 enable_auto_exposure=1 enable_distortion_correction=0 shutter_time_min=11000 shutter_time_max=11000 fsync_mfp=7"
        create: yes
        owner: root
        group: root
        mode: "0644"
      become: yes

    - name: Configure tier4_imx728 modprobe options
      lineinfile:
        path: /etc/modprobe.d/tier4-imx728.conf
        regexp: "^options tier4_imx728"
        line: "options tier4_imx728 trigger_mode=3 enable_auto_exposure=1 enable_distortion_correction=0 shutter_time_min=11000 shutter_time_max=11000 fsync_mfp=7"
        create: yes
        owner: root
        group: root
        mode: "0644"
      become: yes

    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/tier4-camera-gmsl_2.0.0_arm64.deb
        - /tmp/tier4_automotive_hdr_camera
      become: yes
      tags: cleanup
