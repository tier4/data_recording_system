# Data Recording System - Local Installation Playbook
# This playbook installs and configures all components for the DRS on the local host

- name: Setup Data Recording System | Sensing Module
  hosts: "{{ target_host | default('localhost') }}"
  become: true
  gather_facts: true

  vars:
    # Determine ECU ID from hostname or environment variable
    drs_ecu_id: "{{ lookup('env', 'DRS_ECU_ID') | default(ansible_hostname.split('ecu')[-1] | default(0)) }}"
    # Default values - will be resolved in pre_tasks with priority: inventory > env > default
    sensing_system_id_default: aabbccdd
    module_id_default: eeffgghh

  pre_tasks:
    # Resolve sensing_system_id with priority: inventory > env > default
    - name: Get sensing_system_id from inventory or environment
      ansible.builtin.set_fact:
        sensing_system_id: "{{ sensing_system_id | default(lookup('env', 'SENSING_SYSTEM_ID') | default(sensing_system_id_default)) }}"

    # If inventory value is default, use env var if available
    - name: Use environment variable if inventory has default value
      ansible.builtin.set_fact:
        sensing_system_id: "{{ lookup('env', 'SENSING_SYSTEM_ID') | default(sensing_system_id_default) }}"
      when: sensing_system_id == sensing_system_id_default

    # Resolve module_id with priority: inventory > env > default
    - name: Get module_id from inventory or environment
      ansible.builtin.set_fact:
        module_id: "{{ module_id | default(lookup('env', 'MODULE_ID') | default(module_id_default)) }}"

    # If inventory value is default, use env var if available
    - name: Use environment variable if inventory has default value
      ansible.builtin.set_fact:
        module_id: "{{ lookup('env', 'MODULE_ID') | default(module_id_default) }}"
      when: module_id == module_id_default

    # Prompt for sensing_system_id if it's still default value
    - name: Ask for sensing_system_id if default value
      ansible.builtin.pause:
        prompt: |
          Current sensing_system_id: {{ sensing_system_id }}

          This appears to be the default value. Please enter a custom sensing_system_id
          (or press Enter to keep current value):
      register: sensing_system_id_input
      when: sensing_system_id == sensing_system_id_default

    - name: Set sensing_system_id from user input
      ansible.builtin.set_fact:
        sensing_system_id: "{{ sensing_system_id_input.user_input }}"
      when:
        - sensing_system_id_input is defined
        - sensing_system_id_input.user_input is defined
        - sensing_system_id_input.user_input != ""

    # Prompt for module_id if it's still default value
    - name: Ask for module_id if default value
      ansible.builtin.pause:
        prompt: |
          Current module_id: {{ module_id }}

          This appears to be the default value. Please enter a custom module_id
          (or press Enter to keep current value):
      register: module_id_input
      when: module_id == module_id_default

    - name: Set module_id from user input
      ansible.builtin.set_fact:
        module_id: "{{ module_id_input.user_input }}"
      when:
        - module_id_input is defined
        - module_id_input.user_input is defined
        - module_id_input.user_input != ""

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

  roles:
    - role: cleanup
      tags: [drs, cleanup]

    - role: drs_config
      tags: [drs, config]

    - role: ssd_mount
      tags: [anvil, ssd_mount]

    - role: jetpack
      tags: [anvil, nvidia, jetpack]

    - role: jetson
      tags: [anvil, nvidia, jetson]

    - role: journald
      tags: [journald]

    - role: netplan
      tags: [netplan]
      when: netplan_files is defined and netplan_files | length > 0

    - role: can_interface
      tags: [can]
      when: drs_ecu_id == 0 or drs_ecu_id == '0'

    - role: iptables
      tags: [iptables]

    - role: ptp
      tags: [ptp]

    - role: ntp_server
      tags: [ntp, ntp_server]
      when: ntp_server_enabled | default(false) | bool

    - role: ros2
      tags: [ros2]

    - role: anvil_docker
      tags: [anvil, docker]

    - role: cyclonedds
      tags: [cyclonedds]

    - role: drs
      tags: [drs]

    - role: drs_recorder_service
      tags: [drs, service, drs_recorder_service]

    - role: drs_sensor_service
      tags: [drs, service, drs_sensor_service]

    - role: drs_api_service
      tags: [drs, service, drs_api_service]

    - role: drs_ros2_bridge_service
      tags: [drs, service, drs_ros2_bridge_service]
      when: has_dashboard_service | bool

    - role: drs_dashboard_service
      tags: [drs, service, drs_dashboard_service]
      when: has_dashboard_service | bool

    - role: tier4_hdr_camera_driver
      tags: [anvil, driver, tier4_hdr_camera_driver]

    - role: c2_readout_delay_setter
      tags: [anvil, driver, c2_readout_delay_setter]

    - role: sensor_trigger
      tags: [anvil, driver, sensor_trigger]

    - role: external_ssd_mount
      tags: [external_storage,external_ssd_mount]

    - role: nas_mount
      tags: [external_storage, nas_mount]
      when: nas_address is defined

    - role: sync_to_x
      tags: [external_storage, sync_to_x]

    - role: extra_apps
      tags: [extra_apps]

  post_tasks:
    - name: Display installation summary
      ansible.builtin.debug:
        msg: |
          Data Recording System installation completed!

          ECU ID: {{ drs_ecu_id }}
          Sensing System ID: {{ sensing_system_id }}
          Module ID: {{ module_id }}

          Services status can be checked with:
          - systemctl status drs-recorder.service
          - systemctl status drs-sensor.service
          - systemctl status drs-api.service
          - systemctl status jetson-clocks.service

    - name: Reboot notification
      ansible.builtin.debug:
        msg: A system reboot may be required to apply all configurations.
      changed_when: true
      notify: reboot_required

  handlers:
    - name: Reboot required
      ansible.builtin.debug:
        msg: Please reboot the system to ensure all changes take effect.
      listen: reboot_required
