---
# Data Recording System - Local Installation Playbook
# This playbook installs and configures all components for the DRS on the local host

- name: Setup Data Recording System | Control Module
  hosts: localhost
  become: yes
  gather_facts: yes
  
  vars:
    # Determine ECU ID from hostname or environment variable
    drs_ecu_id: "{{ lookup('env', 'DRS_ECU_ID') | default(ansible_hostname.split('ecu')[-1] | default(0)) }}"
    sensing_system_id: "{{ lookup('env', 'SENSING_SYSTEM_ID') | default('aabbccdd') }}"
    module_id: "{{ lookup('env', 'MODULE_ID') | default('eeffgghh') }}"
    
  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

  roles:
    # Phase 1: Network configuration (VLAN, interfaces)
    - role: raspi_network
      tags: ['network', 'control', 'raspi']

    # Phase 2: WiFi Access Point setup
    - role: raspi_hostapd
      tags: ['wifi', 'ap', 'control', 'raspi']

    # Phase 3: DHCP and DNS services
    - role: raspi_dnsmasq
      tags: ['dhcp', 'dns', 'control', 'raspi']

    # Phase 4: Firewall and NAT configuration
    - role: raspi_iptables
      tags: ['firewall', 'nat', 'control', 'raspi']

    # Phase 5: Container runtime
    - role: raspi_docker
      tags: ['docker', 'containers', 'control', 'raspi']

    # Phase 6: VPN connectivity (optional)
    - role: raspi_tailscale
      tags: ['vpn', 'tailscale', 'control', 'raspi']
      when: setup_vpn | default(false)

    # Phase 7: DRS services (if needed for control module)
    - role: journald
      tags: ['journald']
    - role: cyclonedds
      tags: ['cyclonedds']

    - role: drs_api_service
      tags: ['drs', 'service', 'drs_api_service']

    - role: drs_ros2_bridge_service
      tags: ['drs', 'service', 'drs_ros2_bridge_service']

    - role: drs_dashboard_service
      tags: ['drs', 'service', 'drs_dashboard_service']

  post_tasks:
    - name: Display installation summary
      debug:
        msg: |
          Raspberry Pi Control Module configuration complete!

          The system is now configured as:
          - WiFi Access Point (SSID: drs-ap)
          - DHCP/DNS server for WiFi and wired clients
          - NAT router for network connectivity
          - Docker runtime installed
          - Tailscale VPN installed (requires manual authentication)

          Services status can be checked with:
          - systemctl status hostapd.service
          - systemctl status dnsmasq.service
          - systemctl status docker.service
          - systemctl status drs-api.service
          - systemctl status drs-dashboard.service
          - systemctl status drs-ros2-bridge.service
          
    - name: Reboot notification
      debug:
        msg: "A system reboot may be required to apply all configurations."
      changed_when: true
      notify: reboot_required
      
  handlers:
    - name: reboot_required
      debug:
        msg: "Please reboot the system to ensure all changes take effect."