---
# Raspberry Pi Control Module configuration

# Device identification
device_type: raspi
module_type: control

# Hostname configuration (applied at the end of setup)
# Set to desired hostname (e.g., "drs-control-01") or leave empty to keep "raspi"
custom_hostname: ""

# Network configuration for Access Point
# SSID will be dynamically set based on hostname (hostname-ap)
# To override, uncomment and set custom values:
#ap_ssid: "custom-ssid"
#ap_wpa_passphrase: "custom-password"
ap_channel: 6
ap_hw_mode: g
ap_country_code: JP

# DHCP configuration
dhcp_range_start: "192.168.4.2"
dhcp_range_end: "192.168.4.100"
dhcp_lease_time: "12h"

# Network interfaces
wifi_interface: wlan0
ethernet_interface: eth0

# VPN configuration (optional)
tailscale_authkey: ""  # Set if using Tailscale

# DRS services (optional for control module)
setup_drs_api: false
setup_drs_dashboard: false

# Docker configuration
docker_users:
  - "{{ ansible_user }}"

# Module manager configuration
module_manager_config: module-manager-raspi.yaml

# CycloneDDS configuration for Raspberry Pi
cyclonedds:
  network_interface: ['eth0.10']  # loopback and VLAN 10 interface
  minimum_socket_receive_buffer_size: 20MB
  ipfrag_time: 3
  ipfrag_high_thresh: 134217728
  rmem_max: 2147483647
  rmem_default: 8388608
