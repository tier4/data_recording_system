# Global variables for Data Recording System
# These can be overridden in host_vars or at runtime

# DRS Configuration
drs_ecu_id: 0
sensing_system_id: aabbccdd
module_id: eeffgghh
drs_user: "{{ ansible_user }}"
drs_group: "{{ ansible_user }}"
drs_install_dir: /opt/drs/install
drs_build_type: Release

has_raspi_controller: false
has_vehicle_can: false
has_dashboard_service: false
lidar_driver_type: seyond

# This option specifies the camera configuration used.
# If using both C3 and C2 cameras: "-4 C3 -4 C2"
# If using only C2 cameras: "-8 C2"
make_overlay_dts_anvil_option: "-4 C3 -4 C2" # yamllint disable-line rule:quoted-strings

# ROS 2 Configuration
ros_domain_id: 1

# CycloneDDS Configuration
cyclonedds:
  network_interface: [lo, enP1p1s0]
  minimum_socket_receive_buffer_size: 20MB
  ipfrag_time: 3
  ipfrag_high_thresh: 134217728
  rmem_max: 2147483647
  rmem_default: 8388608

# DRS Transfer Configuration
drs_transfer_source_dir: /mnt/ssd/data
drs_transfer_destinations:
  - /mnt/external/data
  - /mnt/nas/data
drs_transfer_rsync_bw_limit: 200m # Override role default (100m) for production throughput
drs_transfer_timer_interval: 1min

# Journald Configuration
journald_system_max_use: 500M

# Sensor Trigger Configuration
sensor_trigger_rtprio: 85
sensor_trigger_memlock: infinity

# NTP Server Configuration (common settings)
# Default: disabled, enable per host in host_vars (ecu0/ecu1 only)
# Note: raspi uses raspi_time_sync role instead
# This role distributes system time synchronized by PTP as NTP server
# WARNING: Cannot be enabled when ptp.time_sync_type is 'NTP'
ntp_server_enabled: false
ntp_server_allow_networks: [192.168.20.0/24]
ntp_server_stratum: 10
