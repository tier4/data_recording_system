# =============================================================================
# Vehicle CAN Bridge — commaai Toyota 2017 DBC config
# =============================================================================
#
# Load together with vehicle_schema.yaml:
#
#   parameters=[vehicle_schema_yaml, toyota_2017_yaml]
#
# DBC: https://github.com/commaai/opendbc/blob/master/opendbc/dbc/generator/toyota/_toyota_2017.dbc
# Place the DBC at the path below (not committed to version control):
#
#   dbc_file: /path/to/_toyota_2017.dbc
#
# Note: Toyota 2017 is a read-mostly OEM DBC. operation.steering.report.angle
# is not available; the steering angle from the column sensor is not mapped to
# the current schema and will be published as STATUS_INITIAL.
# dynamics.angular_vel.pitch / roll are also not available in this DBC.
# =============================================================================

vehicle_can_node:
  ros__parameters:
    vehicle_id: toyota_2017
    can_interface: can0
    dbc_file: /path/to/_toyota_2017.dbc
    loop_rate_hz: 100.0
    signal_timeout_ms: 500
    diagnostics_topic: /vehicle/diagnostics
    diagnostics_rate_hz: 1.0

    # ── Aliases ────────────────────────────────────────────────────────────────
    alias_names:
      # operation.throttle (report only)
      - GAS_PEDAL # GAS_PEDAL_HYBRID  → report position (0..1)
      # operation.brake (report only)
      - BRAKE_AMOUNT # BRAKE             → report position (0..255, converted below)
      # dynamics
      - SPEED # SPEED.SPEED       → longitudinal (km/h→m/s)
      - WHEEL_SPEED_FL # WHEEL_SPEEDS      → front left  (km/h→m/s)
      - WHEEL_SPEED_FR # WHEEL_SPEEDS      → front right
      - WHEEL_SPEED_RL # WHEEL_SPEEDS      → rear left
      - WHEEL_SPEED_RR # WHEEL_SPEEDS      → rear right
      - YAW_RATE # KINEMATICS        → yaw rate (deg/s→rad/s)
      # body.lights
      - TURN_SIGNALS # BLINKERS_STATE    → turn signal enum

    aliases.GAS_PEDAL: operation.throttle.report.position
    aliases.BRAKE_AMOUNT: operation.brake.report.position
    aliases.SPEED: dynamics.speed.longitudinal
    aliases.WHEEL_SPEED_FL: dynamics.wheel_speed.front_left
    aliases.WHEEL_SPEED_FR: dynamics.wheel_speed.front_right
    aliases.WHEEL_SPEED_RL: dynamics.wheel_speed.rear_left
    aliases.WHEEL_SPEED_RR: dynamics.wheel_speed.rear_right
    aliases.YAW_RATE: dynamics.angular_vel.yaw
    aliases.TURN_SIGNALS: body.lights.turn_signal

    # ── Transforms ────────────────────────────────────────────────────────────
    transform_names:
      # Vehicle / wheel speed: km/h → m/s
      - dynamics.speed.longitudinal
      - dynamics.wheel_speed.front_left
      - dynamics.wheel_speed.front_right
      - dynamics.wheel_speed.rear_left
      - dynamics.wheel_speed.rear_right
      # Yaw rate: deg/s → rad/s
      - dynamics.angular_vel.yaw
      # Brake: raw 0..255 → ratio 0..1
      - operation.brake.report.position

    transforms.dynamics.speed.longitudinal.expression: x * 0.277778
    transforms.dynamics.speed.longitudinal.unit: m/s

    transforms.dynamics.wheel_speed.front_left.expression: x * 0.277778
    transforms.dynamics.wheel_speed.front_left.unit: m/s
    transforms.dynamics.wheel_speed.front_right.expression: x * 0.277778
    transforms.dynamics.wheel_speed.front_right.unit: m/s
    transforms.dynamics.wheel_speed.rear_left.expression: x * 0.277778
    transforms.dynamics.wheel_speed.rear_left.unit: m/s
    transforms.dynamics.wheel_speed.rear_right.expression: x * 0.277778
    transforms.dynamics.wheel_speed.rear_right.unit: m/s

    transforms.dynamics.angular_vel.yaw.expression: x * 0.017453293
    transforms.dynamics.angular_vel.yaw.unit: rad/s

    # BRAKE_AMOUNT: raw 0..255 → ratio 0..1
    transforms.operation.brake.report.position.expression: x / 255.0
    transforms.operation.brake.report.position.unit: ""
