# =============================================================================
# Vehicle CAN Bridge — AStuff PACMod v3 DBC config
# =============================================================================
#
# Load together with vehicle_schema.yaml:
#
#   parameters=[vehicle_schema_yaml, pacmod_v3_yaml]
#
# DBC: https://github.com/astuff/pacmod_dbc/blob/v3/as_pacmod.dbc
# Place the DBC at the path below (not committed to version control):
#
#   dbc_file: /path/to/as_pacmod.dbc
#
# Alias format:
#   Simple:   aliases.SIGNAL_NAME: canonical.name
#   Compound: aliases.CAN{decimal_id}_SIGNAL_NAME: canonical.name
#             Used when the same signal name appears in multiple CAN messages.
#             Example: OUTPUT_VALUE appears in ACCEL_RPT(512), BRAKE_RPT(516),
#             STEERING_RPT(556) → disambiguated by CAN ID prefix.
#
# Transforms: exprtk expressions where 'x' is the raw DBC physical value.
#
# Phase 1 scope: dynamics + operation + body (minimal: turn_signal, headlight_mode, brake_lights)
# See docs/initial_adoption_scope.md for rationale.
# =============================================================================

vehicle_can_node:
  ros__parameters:
    vehicle_id: pacmod_vehicle
    can_interface: can0
    dbc_file: /path/to/as_pacmod.dbc
    loop_rate_hz: 100.0
    signal_timeout_ms: 500
    publish_all_signals: true
    all_signals_topic: /vehicle/signals/all
    diagnostics_topic: /vehicle/diagnostics
    diagnostics_rate_hz: 1.0

    # ── Aliases ────────────────────────────────────────────────────────────────
    # Simple signals (unique name across all DBC messages)
    # Compound signals (CAN{id}_SIGNAL) for names shared across messages
    alias_names:
      # operation.steering
      - POSITION # STEERING_CMD.POSITION       → command angle (rad)
      - ROTATION_RATE # STEERING_CMD.ROTATION_RATE  → command rate (rad/s)
      - CAN556_OUTPUT_VALUE # STEERING_RPT(556)           → report angle (rad)
      - CAN556_MANUAL_INPUT # STEERING_RPT(556)           → manual input (rad)
      - STEERING_TORQUE # STEERING_AUX_RPT            → report torque (ratio)
      # operation.throttle
      - ACCEL_CMD # ACCEL_CMD.ACCEL_CMD         → command (ratio)
      - CAN512_OUTPUT_VALUE # ACCEL_RPT(512)              → report position (ratio)
      - CAN512_MANUAL_INPUT # ACCEL_RPT(512)              → manual input (ratio)
      # operation.brake
      - BRAKE_CMD # BRAKE_CMD.BRAKE_CMD         → command (ratio)
      - CAN516_OUTPUT_VALUE # BRAKE_RPT(516)              → report position (ratio)
      - CAN516_MANUAL_INPUT # BRAKE_RPT(516)              → manual input (ratio)
      - BRAKE_DECEL_CMD # BRAKE_DECEL_CMD             → decel demand (m/s^2)
      # operation.shift
      - CAN296_SHIFT_CMD # SHIFT_CMD(296)              → command gear
      - CAN552_OUTPUT_VALUE # SHIFT_RPT(552)              → report gear
      - CAN552_MANUAL_INPUT # SHIFT_RPT(552)              → manual gear
      # operation.parking_brake
      - PARKING_BRAKE_CMD # PARKING_BRAKE_CMD           → command (bool)
      - PARKING_BRAKE_STATUS # PARKING_BRAKE_AUX_RPT       → status enum
      # operation.engaged
      - SYSTEM_ENABLED # GLOBAL_RPT_2                → engaged bool
      # dynamics
      - VEHICLE_SPEED # VEHICLE_SPEED_RPT           → m/s
      - WHEEL_SPD_AXLE_1_LEFT # WHEEL_SPEED_RPT          → rad/s
      - WHEEL_SPD_AXLE_1_RIGHT # WHEEL_SPEED_RPT          → rad/s
      - WHEEL_SPD_AXLE_2_LEFT # WHEEL_SPEED_RPT          → rad/s
      - WHEEL_SPD_AXLE_2_RIGHT # WHEEL_SPEED_RPT          → rad/s
      - LONGITUDINAL_ACCEL # LINEAR_ACCEL_RPT            → m/s^2
      - LATERAL_ACCEL # LINEAR_ACCEL_RPT            → m/s^2
      - VERTICAL_ACCEL # LINEAR_ACCEL_RPT            → m/s^2
      - YAW_VEL # ANG_VEL_RPT                 → rad/s
      - PITCH_VEL # ANG_VEL_RPT                 → rad/s
      - ROLL_VEL # ANG_VEL_RPT                 → rad/s
      # body.lights (Phase 1 minimal subset)
      - CAN560_OUTPUT_VALUE # TURN_RPT(560)               → turn signal enum
      - HEADLIGHTS_ON # HEADLIGHT_AUX_RPT           → headlight mode (bool→enum)
      - BRAKE_LIGHTS_ON # REAR_LIGHTS_RPT             → brake lights bool

    # Simple aliases (unique signal names)
    aliases.POSITION: operation.steering.command.angle
    aliases.ROTATION_RATE: operation.steering.command.rate
    aliases.STEERING_TORQUE: operation.steering.report.torque
    aliases.ACCEL_CMD: operation.throttle.command.position
    aliases.BRAKE_CMD: operation.brake.command.position
    aliases.BRAKE_DECEL_CMD: operation.brake.decel_command
    aliases.PARKING_BRAKE_CMD: operation.parking_brake.command
    aliases.PARKING_BRAKE_STATUS: operation.parking_brake.report
    aliases.SYSTEM_ENABLED: operation.engaged
    aliases.VEHICLE_SPEED: dynamics.speed.longitudinal
    aliases.WHEEL_SPD_AXLE_1_LEFT: dynamics.wheel_speed.front_left
    aliases.WHEEL_SPD_AXLE_1_RIGHT: dynamics.wheel_speed.front_right
    aliases.WHEEL_SPD_AXLE_2_LEFT: dynamics.wheel_speed.rear_left
    aliases.WHEEL_SPD_AXLE_2_RIGHT: dynamics.wheel_speed.rear_right
    aliases.LONGITUDINAL_ACCEL: dynamics.accel.longitudinal
    aliases.LATERAL_ACCEL: dynamics.accel.lateral
    aliases.VERTICAL_ACCEL: dynamics.accel.vertical
    aliases.YAW_VEL: dynamics.angular_vel.yaw
    aliases.PITCH_VEL: dynamics.angular_vel.pitch
    aliases.ROLL_VEL: dynamics.angular_vel.roll
    aliases.HEADLIGHTS_ON: body.lights.headlight_mode
    aliases.BRAKE_LIGHTS_ON: body.lights.brake_lights

    # Compound aliases: disambiguate signals with the same DBC name
    # Format: CAN{decimal_id}_{SIGNAL_NAME}
    aliases.CAN556_OUTPUT_VALUE: operation.steering.report.angle
    aliases.CAN556_MANUAL_INPUT: operation.steering.manual_input
    aliases.CAN512_OUTPUT_VALUE: operation.throttle.report.position
    aliases.CAN512_MANUAL_INPUT: operation.throttle.manual_input
    aliases.CAN516_OUTPUT_VALUE: operation.brake.report.position
    aliases.CAN516_MANUAL_INPUT: operation.brake.manual_input
    aliases.CAN296_SHIFT_CMD: operation.shift.command
    aliases.CAN552_OUTPUT_VALUE: operation.shift.report
    aliases.CAN552_MANUAL_INPUT: operation.shift.manual_input
    aliases.CAN560_OUTPUT_VALUE: body.lights.turn_signal

    # ── Transforms ────────────────────────────────────────────────────────────
    # Expressions use 'x' for the raw DBC physical value.
    transform_names:
      # Wheel speeds: PACMod reports rad/s; convert to m/s using ~0.3m wheel radius
      # Adjust WHEEL_RADIUS_M for the specific vehicle platform.
      - dynamics.wheel_speed.front_left
      - dynamics.wheel_speed.front_right
      - dynamics.wheel_speed.rear_left
      - dynamics.wheel_speed.rear_right
      # Shift gear enum: PACMod(0=PARK,1=REV,2=NEU,3=DRV,4=LOW) → canonical(1,2,3,4,5)
      - operation.shift.command
      - operation.shift.report
      - operation.shift.manual_input
      # Headlight: PACMod HEADLIGHTS_ON (bool) → headlight_mode enum (0=OFF,2=LOW,3=HIGH)
      - body.lights.headlight_mode

    transforms.dynamics.wheel_speed.front_left.expression: x * 0.3
    transforms.dynamics.wheel_speed.front_left.unit: m/s
    transforms.dynamics.wheel_speed.front_right.expression: x * 0.3
    transforms.dynamics.wheel_speed.front_right.unit: m/s
    transforms.dynamics.wheel_speed.rear_left.expression: x * 0.3
    transforms.dynamics.wheel_speed.rear_left.unit: m/s
    transforms.dynamics.wheel_speed.rear_right.expression: x * 0.3
    transforms.dynamics.wheel_speed.rear_right.unit: m/s

    # PACMod gear: 0→1(P), 1→2(R), 2→3(N), 3→4(D), 4→5(L), else→0(UNKNOWN)
    transforms.operation.shift.command.expression: (x<0 or x>4)?0:x+1
    transforms.operation.shift.command.unit: ""
    transforms.operation.shift.report.expression: (x<0 or x>4)?0:x+1
    transforms.operation.shift.report.unit: ""
    transforms.operation.shift.manual_input.expression: (x<0 or x>4)?0:x+1
    transforms.operation.shift.manual_input.unit: ""

    # HEADLIGHTS_ON (bool 0/1) → approximate mode (0=OFF, 2=LOW_BEAM)
    transforms.body.lights.headlight_mode.expression: x>0?2:0
    transforms.body.lights.headlight_mode.unit: ""
